<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: dark square with slight rounding -->
  <rect width="64" height="64" rx="10" fill="#0a0a0c"/>
  
  <!-- Red border accent top -->
  <rect x="0" y="0" width="64" height="3" rx="1" fill="#991b1b"/>
  
  <!-- Gold diamond crest -->
  <polygon points="32,8 40,16 32,24 24,16" fill="none" stroke="#d4af37" stroke-width="1.5"/>
  <circle cx="32" cy="16" r="2.5" fill="#ef4444"/>

  <!-- Katana blade (diagonal, sharp) -->
  <line x1="14" y1="50" x2="48" y2="18" stroke="#f5f5f4" stroke-width="2" stroke-linecap="round"/>
  <!-- Blade edge highlight -->
  <line x1="15" y1="52" x2="50" y2="19" stroke="#d4af37" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Tsuba (guard) circle -->
  <circle cx="22" cy="44" r="5" fill="none" stroke="#991b1b" stroke-width="1.8"/>
  <circle cx="22" cy="44" r="2" fill="#991b1b"/>

  <!-- Handle wrapping lines -->
  <line x1="10" y1="58" x2="20" y2="48" stroke="#78716c" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="57" x2="14" y2="55" stroke="#d4af37" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="15" y1="54" x2="17" y2="52" stroke="#d4af37" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- "AG" monogram subtle -->
  <text x="36" y="55" font-family="serif" font-weight="700" font-size="13" fill="#f5f5f4" opacity="0.85" letter-spacing="1">AG</text>
</svg>
